[package]
name = "agent-task-registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bounded agent handoff registry for SwarmShip releases"
publish = false

[dependencies]
alloy-primitives = "=1.5.7"
alloy-sol-types = "=1.5.7"
stylus-sdk = "=0.10.9"

[dev-dependencies]
stylus-sdk = { version = "=0.10.9", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("contract-client-gen"))'] }

[lib]
crate-type = ["lib", "cdylib"]
